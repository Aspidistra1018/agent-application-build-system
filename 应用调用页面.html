<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用调用页面</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d0d5dd;
      --primary: #155eef;
      --primary-hover: #004eeb;
      --ok: #067647;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: min(720px, calc(100% - 32px));
      margin: 40px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(21, 94, 239, 0.14);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    button {
      height: 40px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      color: #ffffff;
      background: var(--primary);
    }

    .primary:hover {
      background: var(--primary-hover);
    }

    .secondary {
      color: var(--text);
      background: #eaecf0;
    }

    #status {
      min-height: 22px;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--muted);
      word-break: break-word;
    }

    #status.ok {
      color: var(--ok);
    }

    #status.error {
      color: var(--error);
    }
  </style>
</head>
<body>
  <main>
    <h1>应用调用页面</h1>
    <p>本页面按扣子 Web SDK 安装方式加载本地开源版 SDK，并初始化发布后的应用。</p>

    <section class="form">
      <div>
        <label for="sdkUrl">SDK 地址</label>
        <input id="sdkUrl" value="http://127.0.0.1:8080/libs/cn/index.js">
      </div>

      <div>
        <label for="appId">App ID</label>
        <input id="appId" value="7615815047050166272">
      </div>

      <div>
        <label for="workflowId">Workflow ID</label>
        <input id="workflowId" value="7638878153716269056">
      </div>

      <div>
        <label for="token">PAT Token</label>
        <input id="token" value="pat_e6acb85ab5da9390da021a72d81317c4f0bb54e4f694233e004653041509c8fd">
      </div>
    </section>

    <div class="actions">
      <button id="startBtn" class="primary" type="button">启动应用</button>
      <button id="destroyBtn" class="secondary" type="button">销毁当前客户端</button>
    </div>

    <div id="status"></div>
  </main>

  <script type="text/javascript">
    var currentClient = null;
    var currentSdkUrl = '';
    var sdkLoading = false;
    var sdkLoaded = false;

    var fields = {
      sdkUrl: document.getElementById('sdkUrl'),
      appId: document.getElementById('appId'),
      workflowId: document.getElementById('workflowId'),
      token: document.getElementById('token')
    };

    var statusEl = document.getElementById('status');
    var startBtn = document.getElementById('startBtn');
    var destroyBtn = document.getElementById('destroyBtn');

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = type || '';
    }

    function getFieldValue(name) {
      return (fields[name].value || '').trim();
    }

    function validateConfig() {
      var missing = [];
      Object.keys(fields).forEach(function (key) {
        if (!getFieldValue(key)) {
          missing.push(key);
        }
      });
      return missing;
    }

    function resolveSdkGlobal() {
      if (window.CozeWebSDK && window.CozeWebSDK.WebChatClient) {
        return window.CozeWebSDK;
      }

      if (window.CozeWebSDKmain && window.CozeWebSDKmain.WebChatClient) {
        window.CozeWebSDK = window.CozeWebSDKmain;
        return window.CozeWebSDKmain;
      }

      return null;
    }

    function loadSdk(sdkUrl, onReady) {
      if (resolveSdkGlobal() && sdkLoaded && currentSdkUrl === sdkUrl) {
        onReady();
        return;
      }

      if (sdkLoading) {
        setStatus('SDK 正在加载中。', 'ok');
        return;
      }

      sdkLoading = true;
      setStatus('正在加载 SDK：' + sdkUrl, 'ok');

      var webSdkScript = document.createElement('script');
      webSdkScript.type = 'text/javascript';
      webSdkScript.src = sdkUrl;

      webSdkScript.onload = function () {
        sdkLoading = false;
        sdkLoaded = true;
        currentSdkUrl = sdkUrl;
        onReady();
      };

      webSdkScript.onerror = function () {
        sdkLoading = false;
        setStatus('SDK 加载失败，请确认本地前端服务已启动，并且 /libs/cn/index.js 可以访问。', 'error');
      };

      document.head.appendChild(webSdkScript);
    }

    function startApp() {
      var missing = validateConfig();
      if (missing.length > 0) {
        setStatus('缺少配置：' + missing.join(', '), 'error');
        return;
      }

      var sdkUrl = getFieldValue('sdkUrl');
      var appId = getFieldValue('appId');
      var workflowId = getFieldValue('workflowId');
      var token = getFieldValue('token');

      loadSdk(sdkUrl, function () {
        var sdkGlobal = resolveSdkGlobal();
        if (!sdkGlobal || !sdkGlobal.WebChatClient) {
          setStatus('SDK 已加载，但没有找到 CozeWebSDK.WebChatClient。', 'error');
          return;
        }

        if (currentClient && typeof currentClient.destroy === 'function') {
          currentClient.destroy();
          currentClient = null;
        }

        currentClient = new sdkGlobal.WebChatClient({
          config: {
            type: 'app',
            appInfo: {
              appId: appId,
              workflowId: workflowId
            }
          },
          auth: {
            type: 'token',
            token: token,
            onRefreshToken: function () {
              return token;
            }
          },
          ui: {
            base: {
              lang: 'zh-CN',
              layout: 'pc',
              zIndex: 1000
            },
            asstBtn: {
              isNeed: true
            },
            header: {
              isShow: true,
              isNeedClose: true
            },
            chatBot: {
              title: '应用助手',
              uploadable: true,
              isNeedClearContext: true,
              isNeedAddNewConversation: true
            },
            footer: {
              isShow: false
            }
          },
          userInfo: {
            id: 'local-web-sdk-user',
            nickname: '本地用户'
          }
        });

        setStatus('应用已启动。', 'ok');
      });
    }

    startBtn.addEventListener('click', startApp);

    destroyBtn.addEventListener('click', function () {
      if (currentClient && typeof currentClient.destroy === 'function') {
        currentClient.destroy();
        currentClient = null;
        setStatus('当前客户端已销毁。', 'ok');
      } else {
        setStatus('当前没有已启动的客户端。', '');
      }
    });

    window.addEventListener('DOMContentLoaded', startApp);
  </script>
</body>
</html>
