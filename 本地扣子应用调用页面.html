<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地扣子应用调用页面</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: #fffaf3;
      --panel-2: #f4e7d3;
      --text: #4a2d18;
      --muted: #8a6a55;
      --line: rgba(153, 95, 52, 0.18);
      --brand: #b44d28;
      --brand-2: #d1763d;
      --brand-dark: #8e3d20;
      --white: #ffffff;
      --shadow: 0 18px 40px rgba(114, 57, 30, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(212, 118, 61, 0.18), transparent 28%),
        radial-gradient(circle at left bottom, rgba(180, 77, 40, 0.12), transparent 25%),
        linear-gradient(180deg, #f8f2e8 0%, #f3ece1 100%);
    }

    .hero {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 24px 120px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(255, 255, 255, 0.62);
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(34px, 6vw, 58px);
      line-height: 1.05;
      font-weight: 700;
    }

    .lead {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .assistant-trigger {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.28);
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: var(--white);
      box-shadow:
        0 10px 28px rgba(180, 77, 40, 0.36),
        0 0 0 0 rgba(180, 77, 40, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
    }

    .assistant-trigger:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 16px 36px rgba(180, 77, 40, 0.42),
        0 0 0 8px rgba(180, 77, 40, 0.10);
    }

    .assistant-trigger svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
      margin-bottom: 4px;
    }

    .assistant-trigger span {
      font-size: 13px;
      font-weight: 700;
    }

    .assistant-panel {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: min(430px, calc(100vw - 24px));
      height: min(680px, calc(100vh - 24px));
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 10000;
    }

    .assistant-panel.open {
      display: flex;
    }

    .assistant-header {
      padding: 16px 18px;
      color: var(--white);
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .assistant-header h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .assistant-header small {
      display: block;
      margin-top: 4px;
      opacity: 0.82;
      font-size: 12px;
    }

    .icon-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.26);
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .assistant-settings {
      padding: 14px 16px;
      background: rgba(244, 231, 211, 0.82);
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .assistant-settings.collapsed {
      display: none;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .settings-grid .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-dark);
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(180, 77, 40, 0.44);
      box-shadow: 0 0 0 3px rgba(180, 77, 40, 0.10);
    }

    .status {
      min-height: 20px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .status.error {
      color: #b42318;
    }

    .status.ok {
      color: #067647;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: linear-gradient(180deg, #fdf8f1 0%, #f7ead6 100%);
    }

    .chat-history::-webkit-scrollbar {
      width: 6px;
    }

    .chat-history::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(180, 77, 40, 0.28);
    }

    .message {
      max-width: 86%;
      margin-bottom: 14px;
      padding: 12px 13px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(74, 45, 24, 0.05);
      word-break: break-word;
    }

    .message strong {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--brand-dark);
    }

    .message.user {
      margin-left: auto;
      background: linear-gradient(135deg, #fff2de, #ffe1c2);
      border: 1px solid rgba(180, 77, 40, 0.14);
    }

    .message.assistant {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(180, 77, 40, 0.10);
    }

    .message-body {
      font-size: 14px;
      line-height: 1.75;
      color: var(--text);
    }

    .message-body img {
      max-width: 220px;
      max-height: 220px;
      display: block;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid rgba(180, 77, 40, 0.14);
      cursor: pointer;
    }

    .message-body a {
      color: var(--brand);
    }

    .assistant-thinking {
      padding: 6px 2px 0;
      color: var(--brand-dark);
      font-size: 13px;
      opacity: 0.72;
      font-style: italic;
    }

    .assistant-input {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .assistant-input textarea {
      min-height: 84px;
      resize: vertical;
      font-family: inherit;
    }

    .assistant-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .assistant-footer .hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .send-button {
      min-width: 132px;
      height: 40px;
      padding: 0 16px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
      color: var(--white);
      font-weight: 700;
    }

    .send-button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(180, 77, 40, 0.22);
    }

    .preview-mask {
      position: fixed;
      inset: 0;
      background: rgba(42, 23, 12, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      padding: 24px;
    }

    .preview-mask.open {
      display: flex;
    }

    .preview-image {
      max-width: min(86vw, 960px);
      max-height: 86vh;
      border-radius: 12px;
      background: var(--white);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
    }

    @media (max-width: 640px) {
      .hero {
        padding-bottom: 132px;
      }

      .assistant-trigger {
        right: 16px;
        bottom: 16px;
        width: 78px;
        height: 78px;
      }

      .assistant-panel {
        right: 12px;
        bottom: 12px;
        width: calc(100vw - 24px);
        height: calc(100vh - 24px);
      }

      .settings-grid {
        grid-template-columns: 1fr;
      }

      .assistant-footer {
        flex-direction: column;
        align-items: stretch;
      }

      .send-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <script type="text/javascript">
    console.log('LOCAL_APP_PAGE_BUILD=2026-05-12-b');
    var assistantPanel = document.getElementById('assistantPanel');
    var assistantTrigger = document.getElementById('assistantTrigger');
    var closeAssistantBtn = document.getElementById('closeAssistantBtn');
    var toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
    var assistantSettings = document.getElementById('assistantSettings');
    var newConversationBtn = document.getElementById('newConversationBtn');
    var chatHistory = document.getElementById('chatHistory');
    var messageInput = document.getElementById('messageInput');
    var sendBtn = document.getElementById('sendBtn');
    var statusText = document.getElementById('statusText');
    var previewMask = document.getElementById('previewMask');
    var previewImage = document.getElementById('previewImage');

    var configFields = {
      apiHost: document.getElementById('apiHostInput'),
      appId: document.getElementById('appIdInput'),
      workflowId: document.getElementById('workflowIdInput'),
      token: document.getElementById('tokenInput')
    };

    var conversationId = '';
    var currentAssistantBubble = null;
    var isLoading = false;

    function getConfig() {
      return {
        apiHost: (configFields.apiHost.value || '').trim().replace(/\/+$/, ''),
        appId: (configFields.appId.value || '').trim(),
        workflowId: (configFields.workflowId.value || '').trim(),
        token: (configFields.token.value || '').trim()
      };
    }

    function setStatus(message, type) {
      statusText.textContent = message || '';
      statusText.className = 'status' + (type ? ' ' + type : '');
    }

    function buildApiUrl(apiHost, path) {
      return apiHost + path;
    }

    function getOrCreateUserId() {
      var storageKey = 'local_coze_app_user_id';
      var cached = localStorage.getItem(storageKey);
      if (cached) {
        return cached;
      }
      var newId = 'local_app_user_' + Date.now();
      localStorage.setItem(storageKey, newId);
      return newId;
    }

    function scrollToBottom() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatMessage(content) {
      var protectedItems = [];
      var processed = String(content || '');

      processed = processed.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function (_, alt, url) {
        var placeholder = '__PROTECTED_' + protectedItems.length + '__';
        protectedItems.push('<img src="' + escapeHtml(url) + '" alt="' + escapeHtml(alt) + '">');
        return placeholder;
      });

      processed = processed.replace(/(https?:\/\/[^\s]+?\.(?:png|jpg|jpeg|gif|webp|bmp|svg))/gi, function (url) {
        var placeholder = '__PROTECTED_' + protectedItems.length + '__';
        protectedItems.push('<img src="' + escapeHtml(url) + '" alt="image">');
        return placeholder;
      });

      processed = processed.replace(/(https?:\/\/[^\s<]+)/gi, function (url) {
        var placeholder = '__PROTECTED_' + protectedItems.length + '__';
        protectedItems.push('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(url) + '</a>');
        return placeholder;
      });

      processed = escapeHtml(processed).replace(/\n/g, '<br>');

      protectedItems.forEach(function (item, index) {
        processed = processed.replace('__PROTECTED_' + index + '__', item);
      });

      return processed;
    }

    function createMessageBubble(role, content) {
      var wrapper = document.createElement('div');
      wrapper.className = 'message ' + role;

      var title = document.createElement('strong');
      title.textContent = role === 'user' ? '你' : 'AI 助手';

      var body = document.createElement('div');
      body.className = 'message-body';
      body.innerHTML = formatMessage(content);

      wrapper.appendChild(title);
      wrapper.appendChild(body);
      chatHistory.appendChild(wrapper);
      scrollToBottom();

      return {
        wrapper: wrapper,
        body: body
      };
    }

    function setBubbleContent(bubble, content) {
      if (!bubble || !bubble.body) {
        return;
      }
      bubble.body.innerHTML = formatMessage(content);
      scrollToBottom();
    }

    function setThinking(visible) {
      var thinking = document.getElementById('assistantThinking');
      if (!thinking && visible) {
        thinking = document.createElement('div');
        thinking.id = 'assistantThinking';
        thinking.className = 'assistant-thinking';
        thinking.textContent = '思考中...';
        chatHistory.appendChild(thinking);
      }
      if (thinking) {
        thinking.style.display = visible ? 'block' : 'none';
      }
      scrollToBottom();
    }

    function resetConversationView() {
      chatHistory.innerHTML = '';
      createMessageBubble('assistant', '你好，我现在接的是本地开源版扣子应用工作流接口。');
      currentAssistantBubble = null;
    }

    function getConversationName() {
      return 'Local App Conversation';

      /*
        throw new Error('创建会话失败，HTTP ' + response.status);
      }

      var result = await response.json();
      if (!result || result.code !== 0 || !result.data || !result.data.id) {
        throw new Error((result && result.msg) || '创建会话失败');
      }

      conversationId = String(result.data.id);
      */
    }

    function readSseChunk(buffer, onEvent) {
      var lines = buffer.split('\n');
      var remain = lines.pop() || '';
      var eventName = '';
      var dataText = '';

      lines.forEach(function (line) {
        if (line.indexOf('event:') === 0) {
          eventName = line.slice(6).trim();
        } else if (line.indexOf('data:') === 0) {
          dataText += line.slice(5).trim();
          if (eventName) {
            onEvent(eventName, dataText);
            eventName = '';
            dataText = '';
          }
        }
      });

      return remain;
    }

    function processChatEvent(eventName, dataText) {
      var payload = {};
      if (dataText) {
        try {
          payload = JSON.parse(dataText);
        } catch (error) {
          payload = { raw: dataText };
        }
      }

      console.log('processChatEvent', {
        eventName: eventName,
        payload: payload
      });

      if (eventName === 'conversation.chat.created') {
        if (payload.conversation_id) {
          conversationId = String(payload.conversation_id);
        }
        setStatus('会话已创建，正在执行工作流。', 'ok');
        return;
      }

      if (eventName === 'conversation.chat.in_progress') {
        setStatus('工作流执行中。', 'ok');
        return;
      }

      if (eventName === 'conversation.message.delta') {
        if (!currentAssistantBubble) {
          currentAssistantBubble = createMessageBubble('assistant', '');
        }
        var deltaText = payload.content || '';
        if (deltaText) {
          var currentText = currentAssistantBubble.body.getAttribute('data-raw-text') || '';
          currentText += deltaText;
          currentAssistantBubble.body.setAttribute('data-raw-text', currentText);
          setBubbleContent(currentAssistantBubble, currentText);
        }
        return;
      }

      if (eventName === 'conversation.message.completed') {
        if (payload.type === 'follow_up') {
          return;
        }
        if (!currentAssistantBubble) {
          currentAssistantBubble = createMessageBubble('assistant', '');
        }
        var completedText = payload.content || '';
        currentAssistantBubble.body.setAttribute('data-raw-text', completedText);
        setBubbleContent(currentAssistantBubble, completedText);
        return;
      }

      if (eventName === 'conversation.chat.completed') {
        setStatus('本轮对话已完成。', 'ok');
        return;
      }

      if (eventName === 'conversation.chat.failed' || eventName === 'error') {
        var errorText = payload.msg || payload.raw || '工作流执行失败';
        setStatus(errorText, 'error');
        if (!currentAssistantBubble) {
          currentAssistantBubble = createMessageBubble('assistant', errorText);
        } else {
          setBubbleContent(currentAssistantBubble, errorText);
        }
        return;
      }

      if (eventName === 'done') {
        return;
      }
    }

    async function sendStreamMessage(userMessage) {
      var config = getConfig();
      if (!config.apiHost || !config.appId || !config.workflowId || !config.token) {
        throw new Error('配置不完整');
      }

      if (conversationId === undefined || conversationId === null) {
        conversationId = '';
      }

      var requestPayload = {
        workflow_id: config.workflowId,
        app_id: config.appId,
        parameters: JSON.stringify({
          CONVERSATION_NAME: getConversationName()
        }),
        ext: {
          user_id: getOrCreateUserId()
        },
        additional_messages: [
          {
            role: 'user',
            content: userMessage,
            content_type: 'text',
            type: 'question'
          }
        ]
      };

      if (conversationId) {
        requestPayload.conversation_id = conversationId;
      }

      console.log('sendStreamMessage entered', {
        apiHost: config.apiHost,
        workflowId: config.workflowId,
        appId: config.appId,
        conversationId: conversationId
      });
      console.log('before fetch /v1/workflows/chat', requestPayload);

      var response = await fetch(buildApiUrl(config.apiHost, '/v1/workflows/chat'), {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + config.token,
          'Content-Type': 'application/json',
          'Accept': 'text/event-stream'
        },
        body: JSON.stringify(requestPayload)
      });

      console.log('after fetch /v1/workflows/chat', {
        ok: response.ok,
        status: response.status,
        statusText: response.statusText,
        hasBody: !!response.body
      });

      var responseContentType = (response.headers.get('content-type') || '').toLowerCase();
      if (responseContentType.indexOf('application/json') >= 0) {
        var jsonText = await response.text();
        console.log('json error response /v1/workflows/chat', jsonText);
        try {
          var jsonPayload = JSON.parse(jsonText);
          throw new Error(jsonPayload.msg || jsonText);
        } catch (parseError) {
          if (parseError instanceof Error && parseError.message !== jsonText) {
            throw parseError;
          }
          throw new Error(jsonText);
        }
      }

      if (!response.ok || !response.body) {
        throw new Error('聊天请求失败，HTTP ' + response.status);
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffer = '';

      while (true) {
        var readResult = await reader.read();
        if (readResult.done) {
          console.log('stream reader done');
          break;
        }
        buffer += decoder.decode(readResult.value, { stream: true });
        console.log('stream chunk received', {
          chunkLength: readResult.value ? readResult.value.length : 0,
          bufferPreview: buffer.slice(0, 300)
        });
        buffer = readSseChunk(buffer, processChatEvent);
      }
    }

    async function sendMessage() {
      console.log('sendMessage entered', {
        isLoading: isLoading,
        inputLength: (messageInput.value || '').trim().length
      });
      if (isLoading) {
        console.log('sendMessage skipped because isLoading=true');
        return;
      }

      var userMessage = (messageInput.value || '').trim();
      if (!userMessage) {
        console.log('sendMessage skipped because input is empty');
        return;
      }

      isLoading = true;
      sendBtn.disabled = true;
      setThinking(true);
      setStatus('', '');

      createMessageBubble('user', userMessage);
      messageInput.value = '';
      currentAssistantBubble = createMessageBubble('assistant', '');
      currentAssistantBubble.body.setAttribute('data-raw-text', '');

      try {
        await sendStreamMessage(userMessage);
      } catch (error) {
        console.error('sendMessage failed', error);
        setStatus(error.message || String(error), 'error');
        setBubbleContent(currentAssistantBubble, '请求失败：' + (error.message || String(error)));
      } finally {
        console.log('sendMessage finished');
        isLoading = false;
        sendBtn.disabled = false;
        setThinking(false);
      }
    }

    async function clearRemoteContext() {
      var config = getConfig();
      if (!conversationId) {
        resetConversationView();
        return;
      }

      try {
        var response = await fetch(buildApiUrl(config.apiHost, '/v1/conversations/' + conversationId + '/clear'), {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + config.token,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error('清空上下文失败，HTTP ' + response.status);
        }

        setStatus('远端上下文已清空。', 'ok');
      } catch (error) {
        setStatus(error.message || String(error), 'error');
      }
    }

    assistantTrigger.addEventListener('click', function () {
      assistantPanel.classList.add('open');
      assistantTrigger.style.display = 'none';
      if (!chatHistory.children.length) {
        resetConversationView();
      }
    });

    closeAssistantBtn.addEventListener('click', function () {
      assistantPanel.classList.remove('open');
      assistantTrigger.style.display = 'flex';
    });

    toggleSettingsBtn.addEventListener('click', function () {
      assistantSettings.classList.toggle('collapsed');
    });

    newConversationBtn.addEventListener('click', async function () {
      await clearRemoteContext();
      conversationId = '';
      resetConversationView();
      setStatus('已切换为新会话。', 'ok');
    });

    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function (event) {
      if (event.ctrlKey && event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    });

    chatHistory.addEventListener('click', function (event) {
      var target = event.target;
      if (target && target.tagName === 'IMG') {
        previewImage.src = target.src;
        previewMask.classList.add('open');
      }
    });

    previewMask.addEventListener('click', function () {
      previewMask.classList.remove('open');
      previewImage.src = '';
    });

    resetConversationView();
  </script>
</body>
</html>
